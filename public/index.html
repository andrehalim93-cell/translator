<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #fff; min-height: 100vh; padding: 20px; }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
  p.sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  select, button { padding: 10px 12px; border-radius: 10px; border: none; font-size: 14px; }
  select { background: #334155; color: #fff; flex: 1; outline: none; }
  #swapBtn { background: #334155; color: #fff; cursor: pointer; font-size: 18px; width: 44px; }
  textarea { width: 100%; min-height: 110px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 15px; outline: none; resize: vertical; }
  #result { width: 100%; min-height: 110px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 15px; white-space: pre-wrap; color: #e2e8f0; }
  #translateBtn { width: 100%; background: #6366f1; color: #fff; font-weight: 700; font-size: 16px; padding: 13px; cursor: pointer; margin-top: 12px; }
  #translateBtn:active { transform: scale(0.98); }
  .hint { text-align: center; color: #64748b; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>🌐 Translator</h1>
  <p class="sub">Indonesia - Inggris - Jepang - Korea & lainnya</p>

  <div class="card">
    <div class="row">
      <select id="fromLang">
        <option value="id">Indonesia</option>
        <option value="en">English</option>
        <option value="ja">Jepang</option>
        <option value="ko">Korea</option>
        <option value="zh">China</option>
        <option value="es">Spanyol</option>
        <option value="fr">Perancis</option>
        <option value="de">Jerman</option>
      </select>
      <button id="swapBtn" onclick="swapLang()">⇄</button>
      <select id="toLang">
        <option value="en">English</option>
        <option value="id">Indonesia</option>
        <option value="ja">Jepang</option>
        <option value="ko">Korea</option>
        <option value="zh">China</option>
        <option value="es">Spanyol</option>
        <option value="fr">Perancis</option>
        <option value="de">Jerman</option>
      </select>
    </div>

    <textarea id="inputText" placeholder="Ketik teks di sini... contoh: selamat pagi"></textarea>
    <button id="translateBtn" onclick="doTranslate()">Translate</button>
  </div>

  <div class="card">
    <div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">Hasil:</div>
    <div id="result">Hasil terjemahan muncul di sini...</div>
  </div>
  <p class="hint">Klik Shizuku di pojok kanan bawah buat interaksi</p>
</div>

<script>
function swapLang(){
  const from = document.getElementById('fromLang');
  const to = document.getElementById('toLang');
  const tmp = from.value;
  from.value = to.value;
  to.value = tmp;
}

async function doTranslate(){
  const text = document.getElementById('inputText').value.trim();
  const from = document.getElementById('fromLang').value;
  const to = document.getElementById('toLang').value;
  const resultEl = document.getElementById('result');
  if(!text){ resultEl.innerText = 'Ketik dulu teksnya!'; return; }
  resultEl.innerText = 'Menerjemahkan...';
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
    const data = await res.json();
    resultEl.innerText = data.responseData.translatedText || 'Gagal menerjemahkan';
  }catch(e){
    resultEl.innerText = 'Error: cek internet lu';
  }
}
</script>

<!-- Live2D Shizuku - yang udah terbukti jalan -->
<script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
<script>
L2Dwidget.init({
  model: {
    jsonPath: 'https://cdn.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json'
  },
  display: { position: 'right', width: 150, height: 210, hOffset: 0, vOffset: -10 },
  mobile: { show: true, scale: 0.8 },
  react: { opacityDefault: 1, opacityOnHover: 1 }
});
</script>
</body>
</html>
